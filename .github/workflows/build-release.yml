name: Build Windows Release

on:
  workflow_dispatch: # اجازه اجرای دستی از پنل گیت‌هاب
  push:
    tags:
      - "v*" # اجرای خودکار در صورت پوش کردن تگ جدید

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write # دسترسی اجباری و حیاتی برای ساخت تگ و ریلیز جدید

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # واکشی تمام هسیتوری جهت اجازه کامیت تغییرات ورژن به برنچ

      # این بخش به صورت هوشمند تصمیم می‌گیرد که چه تگی برای ریلیز بسازد
      - name: Determine Release Tag
        id: generate_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # اگر دولوپر دستی تگ v2.0.1 را پوش کرده باشد، از همان استفاده می‌کند
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # اگر اکشن به صورت دستی (دکمه Run workflow) اجرا شده باشد، یک تگ اتوماتیک می‌سازد
            TAG_NAME="v2.0.${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Generated Tag: $TAG_NAME"

      # اضافه کردن همگام‌ساز خودکار شماره نسخه کارگو منطبق بر تگ تولیدی
      - name: Update Cargo.toml Version Automatically
        shell: bash
        run: |
          TAG_NAME="${{ steps.generate_tag.outputs.TAG_NAME }}"
          # حذف حرف v از ابتدای تگ برای درج نسخه پاکیزه عددی در کارگو
          CLEAN_VERSION="${TAG_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$CLEAN_VERSION\"/" Cargo.toml
          echo "Cargo.toml version updated to: $CLEAN_VERSION"

      # ثبت و کامیت خودکار تغییر نسخه در سورس گیت‌هاب با مکانیزم ضد تداخل (Fail-Safe)
      - name: Commit Updated Cargo.toml to Repo
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump package version to ${{ steps.generate_tag.outputs.TAG_NAME }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push skipped (e.g. branch protection or manual run on tag branch)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # سیستم کش هوشمند برای افزایش چشمگیر سرعت بیلد در اجراهای بعدی
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Prepare Artifact
        run: |
          mkdir dist
          copy target\release\config-collector-windows.exe dist\ConfigCollectorWindows.exe

      # ساخت ریلیز و آپلود فایل، بدون شرط‌های محدود کننده قبلی
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.TAG_NAME }}
          name: Release ${{ steps.generate_tag.outputs.TAG_NAME }}
          files: dist/ConfigCollectorWindows.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
