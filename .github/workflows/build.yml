name: Build & Release Freedom Config Collector

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-engine:
    name: Test Go Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: engine/go.sum

      - name: Run Engine Tests
        working-directory: engine
        run: |
          go test -v ./...

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    needs: test-engine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Compile Go CLI Binary
        working-directory: engine
        run: |
          go build -ldflags="-s -w" -o ../bin/ccli.exe ./cmd/ccli

      - name: Build Flutter Windows Desktop
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          $dist = "dist/FreedomConfigCollector_Windows_x64"
          New-Item -ItemType Directory -Path $dist -Force
          Copy-Item -Path "app/build/windows/x64/runner/Release/*" -Destination $dist -Recurse
          Copy-Item -Path "bin/ccli.exe" -Destination $dist
          Copy-Item -Path "config/settings.json" -Destination $dist
          Compress-Archive -Path "$dist/*" -DestinationPath "FreedomConfigCollector_Windows_x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreedomConfigCollector-Windows
          path: FreedomConfigCollector_Windows_x64.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-engine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Build Flutter Android APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreedomConfigCollector-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: FreedomConfigCollector-Windows

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: FreedomConfigCollector-Android

      - name: Generate SHA256 Checksums
        run: |
          sha256sum FreedomConfigCollector_Windows_x64.zip app-release.apk > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FreedomConfigCollector_Windows_x64.zip
            app-release.apk
            SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
