[package]
name = "config-collector-windows"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <youremail@example.com>"]
description = "Telegram Config Collector Pro (Ultra Fast Concurrent Edition)"

[dependencies]
# رابط کاربری گرافیکی قدرتمند و سبک
eframe = { version = "0.29", default-features = true }
egui = "0.29"

# شبکه و درخواست‌های HTTP (پشتیبانی از پراکسی، Socks5 و فشرده‌سازی برای مصرف کمتر اینترنت)
reqwest = { version = "0.12", default-features = true, features = ["blocking", "socks", "gzip", "brotli", "deflate", "charset"] }

# پردازش و استخراج الگوهای کانفیگ‌ها
regex = "1.11"

# مدیریت زمان و تاریخ پست‌های تلگرام
chrono = { version = "0.4", features = ["serde"] }

# مدیریت فرمت داده‌ها (فایل‌های کانفیگ و هیستوری)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# مدیریت ارورها بدون کرش کردن برنامه
anyhow = "1.0"

[profile.release]
# بهینه‌سازی‌های فوق‌العاده برای ویندوز (کاهش حجم فایل exe و افزایش سرعت اجرا)
opt-level = 3          # بالاترین سطح بهینه‌سازی سرعت
lto = true             # بهینه‌سازی در زمان لینک کردن (Link Time Optimization)
codegen-units = 1      # کامپایل یکپارچه برای پرفورمنس بهتر
strip = true           # حذف سمبل‌های دیباگ برای کاهش شدید حجم فایل نهایی
panic = "abort"        # بستن سریع برنامه در صورت خطای بحرانی (بدون ذخیره بک‌تریس، برای سبکی)
