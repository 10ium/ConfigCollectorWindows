[package]
name = "config-collector-windows"
version = "0.2.0"
edition = "2021"
authors = ["Your Name <youremail@example.com>"]
description = "Telegram Config Collector Pro Phase 2"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
reqwest = { version = "0.12", default-features = true, features = ["blocking", "socks", "gzip", "brotli", "deflate", "charset", "json"] }
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
base64 = "0.22"
zip = "0.6"
self-replace = "1.3"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
